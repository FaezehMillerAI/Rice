[project]
name = "rice"
version = "0.2.0"
description = "Rice Pathogen SALM training, evaluation, and KG runtime"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "datasets==5.0.1",
    "huggingface-hub==1.33.0",
    "matplotlib==3.11.2",
    "numpy<2.4",
    "peft==0.21.0",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "sentencepiece==0.2.3",
    "torch==2.9.0",
    "transformers==5.17.0",
    "trl==1.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
