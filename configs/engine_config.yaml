# ==============================================================================
# Rice Pathogen SALM — Reasoning Engine & Scoring Configuration
# ==============================================================================

# Three-Valued Logic (3VL) Weights
scoring_weights:
  w_sign: 3.0                          # Weight for confirmed pathognomonic physical sign (e.g. bacterial ooze)
  w_symptom: 2.0                       # Weight for confirmed general symptom (e.g. yellowing)
  w_environmental: 2.0                 # Weight for confirmed weather/environmental condition
  w_growth_stage: 1.0                  # Weight for phenological match
  w_field_distribution: 1.0            # Weight for field distribution pattern
  w_penalty_required_false: -3.0       # Penalty when required symptom is explicitly absent
  w_penalty_contradiction_true: -3.0   # Penalty when contradicting symptom is explicitly present
  w_unknown_neutral: 0.0               # Weight for unmentioned/unknown parameters (Open World Assumption)

# Diagnostic Thresholds
thresholds:
  confidence_high: 6.0                 # Minimum candidate score for HIGH confidence
  confidence_medium: 3.0               # Minimum candidate score for MEDIUM confidence
  confidence_low: 1.0                  # Minimum candidate score for LOW confidence
  max_differential_candidates: 3       # Max number of causes returned in differential array

# Question Utility Multipliers (Step 7 Formula)
question_utility:
  alpha_separation: 1.0                # Weight of number of candidates separated
  beta_reliability: 1.0                # Weight of observation diagnostic reliability
  gamma_observability: 1.0             # Weight of field observability
  delta_safety: 1.5                    # Extra weight multiplier for safety/escalation importance
